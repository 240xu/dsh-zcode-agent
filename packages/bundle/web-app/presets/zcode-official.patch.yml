# Agent preset zcode-official: ZCode v3.14.0 behavior ported from the official
# open-source repository zai-org/ZCode@872ad96 (Apache-2.0). Every model-facing
# text rides @deepseek-ai/dsh-zcode-official (identity/Harness, dynamic
# behavior, context management, env info, git system context, file-based
# memory, tool description builders, subagent personas); the plan-mode section
# carries the official 4-phase plan workflow reminder. The agent loop, tool
# pipeline, permissions, and session log are DSH's own. Tools reuse the
# standard preset's DSH rows; the official tool semantics arrive as the
# zcode-official tool-semantics section (same layering as the retired
# evidence-based zcode preset used).
#
# Permission modes — official CollaborationMode is "plan" | "build" | "edit" |
# "yolo" | "auto" (contracts/interfaces/session.port.ts), decided in
# permission/service.ts: alwaysAsk -> yolo (allow-all unless plan) -> auto
# (reserved, denies) -> disallowedTools -> project deny/ask -> plan
# (readOnly allow, else deny) -> project allow -> preapprovals -> allowedTools
# -> edit (fileEdit allow, rest via build) -> build (readOnly allow;
# critical/high risk ask; session-local low-risk allow; side effects ask).
# DSH permission is host-level: build ~ workspace-write, yolo ~
# danger-full-access, plan ~ the planning row below.
- insert:
    - id: preset-zcode-official
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: zcode-official
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              # Official identity intro rides the zcode-official section; a
              # second persona prefix would duplicate the identity line.
              prefix: ''
          - id: zcode-official
            name: '@deepseek-ai/dsh-zcode-official'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # The official-shape bash shadow (timeout param, optional
          # description) is registered by the zcode-official row above;
          # it delegates to the core bash via the global-layer definition.
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    Plan mode is active. The user indicated that they do not want you to execute yet -- you MUST NOT make any edits, run any non-readonly tools (including changing configs or making commits), or otherwise make any changes to the system. This supercedes any other instructions you have received.

                    ## Plan Workflow

                    ### Phase 1: Initial Understanding
                    Goal: Gain a comprehensive understanding of the user's request by reading through code and asking them questions. Critical: In this phase you should only use the Explore subagent type.

                    1. Focus on understanding the user's request and the code associated with their request. Actively search for existing functions, utilities, and patterns that can be reused — avoid proposing new code when suitable implementations already exist.

                    2. **Launch up to 3 Explore agents IN PARALLEL** (single message, multiple tool calls) to efficiently explore the codebase.
                       - Use 1 agent when the task is isolated to known files, the user provided specific file paths, or you're making a small targeted change.
                       - Use multiple agents when: the scope is uncertain, multiple areas of the codebase are involved, or you need to understand existing patterns before planning.
                       - Quality over quantity - 3 agents maximum, but you should try to use the minimum number of agents necessary (usually just 1)
                       - If using multiple agents: Provide each agent with a specific search focus or area to explore. Example: One agent searches for existing implementations, another explores related components, a third investigating testing patterns

                    ### Phase 2: Design
                    Goal: Design an implementation approach.

                    **Guidelines:**
                    - Use the context gathered in Phase 1, including relevant files and code paths.
                    - Account for the user's requirements and constraints.
                    - Produce a concrete implementation plan that is detailed enough to execute.
                    - Consider useful perspectives for the task type:
                      - New feature: simplicity vs performance vs maintainability
                      - Bug fix: root cause vs workaround vs prevention
                      - Refactoring: minimal change vs clean architecture

                    ### Phase 3: Review
                    Goal: Review the plan(s) from Phase 2 and ensure alignment with the user's intentions.
                    1. Read the critical files to deepen your understanding
                    2. Ensure that the plans align with the user's original request
                    3. Use AskUserQuestion to clarify any remaining questions with the user

                    ### Phase 4: Call ExitPlanMode
                    At the very end of your turn, once you have asked the user questions and are happy with your final plan - you should always call ExitPlanMode to indicate to the user that you are done planning.
                    This is critical - your turn should only end with either using the AskUserQuestion tool OR calling ExitPlanMode. Do not stop unless it's for these 2 reasons

                    **Important:** Use AskUserQuestion ONLY to clarify requirements or choose between approaches. Use ExitPlanMode to request plan approval. Do NOT ask about plan approval in any other way - no text questions, no AskUserQuestion. Phrases like "Is this plan okay?", "Should I proceed?", "How does this plan look?", "Any changes before we start?", or similar MUST use ExitPlanMode.

                    NOTE: At any point in time through this workflow you should feel free to ask the user questions or clarifications using the AskUserQuestion tool. Don't make large assumptions about user intent. The goal is to present a well researched plan to the user, and tie any loose ends before implementation begins.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-zcode-official'
                config:
                  role: compaction
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              # The official single `Agent` multiplexer (subagent_type dispatch,
              # official personas + allowlists) is registered by the
              # zcode-official row above; no separate tool-subagent rows — the
              # official contract is ONE delegation tool.
          # The official-shape ask_user_question shadow is registered by the
          # zcode-official row above.
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # The official-shape web_fetch shadow (http→https upgrade,
          # redirect notice, 15-minute per-URL cache) is registered by the
          # zcode-official row above via the ctx.web seam; web_search and the
          # global web_fetch remain available from the base-layer tool-web.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
